<form (ngSubmit)="seConnecter()">
  <h1>Connexion</h1>

  <label>
    Login
    <input name="login" [(ngModel)]="login" required data-testid="login" />
  </label>

  <label>
    Mot de passe
    <input name="motDePasse" type="password" [(ngModel)]="motDePasse" required data-testid="mot-de-passe" />
  </label>

  <button type="submit" data-testid="soumettre">Se connecter</button>

  @if (messageErreur) {
    <p data-testid="erreur">{{ messageErreur }}</p>
  }
</form>
