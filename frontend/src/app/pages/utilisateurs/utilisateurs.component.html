<div class="page">
  <h1>Utilisateurs</h1>

  <section class="card">
    <form class="inline-form" (ngSubmit)="creer()">
      <input class="field" name="nouveauLogin" [(ngModel)]="nouveauLogin" placeholder="Login" required data-testid="nouveau-login" />
      <input class="field" name="nouveauNom" [(ngModel)]="nouveauNom" placeholder="Nom" data-testid="nouveau-nom" />
      <button type="submit" class="btn btn-primary" data-testid="creer">Créer</button>
    </form>
  </section>

  @if (utilisateurs.length === 0) {
    <p class="resource-list__vide">Aucun Utilisateur pour l'instant.</p>
  } @else {
    <section class="card">
      <ul class="resource-list">
        @for (utilisateur of utilisateurs; track utilisateur.id) {
          <li class="resource-list__item" data-testid="utilisateur">
            <div>
              <span class="resource-list__nom">{{ utilisateur.login }}</span>
              <span class="resource-list__meta">{{ utilisateur.nom }}</span>
            </div>
            <span class="badge">{{ utilisateur.role }}</span>
            <button
              type="button"
              class="btn btn-danger resource-list__actions"
              (click)="supprimer(utilisateur.id)"
              data-testid="supprimer"
            >
              Supprimer
            </button>
          </li>
        }
      </ul>
    </section>
  }
</div>
